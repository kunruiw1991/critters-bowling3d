<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎳 Critter Bowling 3D: Rainbow Strike Alley! 🌈</title>
  <link rel="icon" href="icons/dogday.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="webgl-canvas" aria-label="Critter Bowling 3D Alley"></canvas>

    <!-- Top HUD: Stage Rail + Character Picker + Frame Pin Dots + Rainbow Fever Gauge -->
    <header id="top-hud">
      <div id="stage-rail" role="tablist" aria-label="Bowling Alleys"></div>

      <div id="center-hud-row">
        <div id="critter-bar" role="radiogroup" aria-label="Choose Bowler Critter"></div>

        <div id="frame-strip" aria-label="Bowling Frames & Pin Deck">
          <div id="frame-dots"></div>
          <div id="mini-pin-rack" aria-label="Standing Pins"></div>
        </div>

        <div id="fever-cluster" aria-label="Rainbow Fever Meter">
          <span class="hud-emoji" id="fever-icon">🌈</span>
          <div id="fever-bar-track">
            <div id="fever-bar-fill"></div>
          </div>
          <button id="audio-btn" type="button" aria-label="Toggle Sound">🔊</button>
        </div>
      </div>
    </header>

    <!-- Right-side 5-Critter Live Tournament Leaderboard -->
    <aside id="leaderboard-rail" aria-label="5-Critter Tournament Standings"></aside>

    <!-- Center Celebrations (Strike / Spare / Rainbow Fever / Split) -->
    <div id="banner-toast" aria-live="polite">
      <div id="banner-emojis">🎳✨⭐⭐⭐</div>
    </div>

    <!-- Bottom Zero-Text Visual Cockpit -->
    <footer id="bottom-cockpit">
      <!-- Left Aim & Spin Cluster -->
      <div class="cockpit-cluster" id="aim-cluster">
        <button class="cockpit-btn aim-btn" id="btn-aim-left" type="button" aria-label="Aim Left">⬅️</button>
        <button class="cockpit-btn roll-btn" id="btn-roll" type="button" aria-label="Roll Bowling Ball">🎳</button>
        <button class="cockpit-btn aim-btn" id="btn-aim-right" type="button" aria-label="Aim Right">➡️</button>
      </div>

      <!-- Center Aim & Spin Visual Arc Gauge -->
      <div id="aim-Readout" aria-label="Aim and Spin Meter">
        <div id="power-indicator-row">
          <span class="power-glyph" aria-hidden="true">⚡</span>
          <div id="power-oscillator-track">
            <div id="power-oscillator-fill"></div>
            <div id="power-sweetspot"></div>
          </div>
          <span class="power-glyph" aria-hidden="true">🎯</span>
        </div>
        <div id="spin-indicator-row">
          <span class="spin-glyph" id="spin-left-btn" role="button" tabindex="0" aria-label="Spin Left">↩️</span>
          <div id="spin-track" role="slider" aria-label="Curve Spin Gauge" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
            <div id="spin-center-tick"></div>
            <div id="spin-knob"></div>
          </div>
          <span class="spin-glyph" id="spin-right-btn" role="button" tabindex="0" aria-label="Spin Right">↪️</span>
        </div>
      </div>

      <!-- Right 3 Power Pedals -->
      <div class="cockpit-cluster" id="pedal-cluster">
        <button class="pedal-btn" id="pedal-curve" type="button" data-pedal="1" aria-label="Curve Spin">
          <span class="pedal-icon">🌪️</span>
          <span class="pedal-charge-ring"><span class="pedal-fill" id="fill-pedal-1"></span></span>
          <span class="pedal-pip-row" id="pips-pedal-1"></span>
        </button>
        <button class="pedal-btn" id="pedal-fireball" type="button" data-pedal="2" aria-label="Fireball Strike">
          <span class="pedal-icon">⚡</span>
          <span class="pedal-charge-ring"><span class="pedal-fill" id="fill-pedal-2"></span></span>
          <span class="pedal-pip-row" id="pips-pedal-2"></span>
        </button>
        <button class="pedal-btn" id="pedal-bomb" type="button" data-pedal="3" aria-label="Giant Bomb Ball">
          <span class="pedal-icon">💥</span>
          <span class="pedal-charge-ring"><span class="pedal-fill" id="fill-pedal-3"></span></span>
          <span class="pedal-pip-row" id="pips-pedal-3"></span>
        </button>
      </div>
    </footer>

    <!-- End-of-Match Podium / Defeat Modal (100% Visual Icons & Stars) -->
    <div id="podium-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Tournament Results">
      <div id="podium-card">
        <div id="modal-crest">🏆🌈🎳</div>
        <div id="modal-stars">⭐⭐⭐</div>
        <div id="podium-stage"></div>
        <div id="modal-standings"></div>
        <div id="modal-actions">
          <button id="btn-retry" class="modal-action-btn retry" type="button" aria-label="Retry Alley">🔄</button>
          <button id="btn-next" class="modal-action-btn next" type="button" aria-label="Next Alley">▶️🌈</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
